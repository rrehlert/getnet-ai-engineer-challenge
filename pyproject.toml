[project]
name = "getnet-multi-agent"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb==1.5.9",
    "ddgs==9.16.1",
    "fastapi==0.162.0",
    "fastembed==0.9.1",
    "langchain==1.4.7",
    "langchain-openai==1.7.3",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.18",
    "pydantic-settings==2.16.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "lxml==6.1.3",
    "pytest==9.2.0",
    "trafilatura==2.3.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
